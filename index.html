<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Tourism Audio Guide</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4faf9;color:#17323a}header{background:linear-gradient(135deg,#0b3440,#0f766e);color:white;padding:24px 18px;position:sticky;top:0;z-index:2}header h1{margin:0 0 6px;font-size:25px}header p{margin:0;opacity:.88}.wrap{max-width:1100px;margin:auto;padding:18px}.search{width:100%;padding:14px;border:0;border-radius:14px;margin:16px 0;box-shadow:0 3px 16px #0001;font-size:16px}.chips{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.chips button,.btn{border:0;border-radius:12px;padding:10px 14px;background:#0f766e;color:white;font-weight:700}.chips button.alt{background:#dcefeb;color:#0b4f4a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:white;border-radius:18px;overflow:hidden;box-shadow:0 8px 25px #00000012}.pic{height:170px;background:linear-gradient(135deg,#8cc7ba,#e8d2a6);display:flex;align-items:center;justify-content:center;font-size:60px}.content{padding:16px}.content h3{margin:0 0 6px}.muted{color:#60777c;font-size:14px}.fav{float:right;background:none;border:0;font-size:23px}.detail{display:none}.detail.show{display:block}.home.hide{display:none}.hero{background:#dcefeb;border-radius:20px;padding:22px;margin-bottom:18px}.back{margin-bottom:12px;background:none;border:0;color:#0f766e;font-weight:700}.select{padding:12px;border-radius:10px;border:1px solid #c9deda;width:100%;margin:10px 0}.audio{background:#082f3a;color:white;border-radius:18px;padding:16px;margin-top:18px}.audio button{margin-right:8px}.progress{width:100%}section{margin-top:22px}.nav{display:flex;gap:8px;margin-top:14px}.nav button{flex:1}.empty{text-align:center;padding:30px;color:#60777c}@media(max-width:600px){header h1{font-size:21px}.pic{height:145px}}
</style></head><body>
<header><h1>🌍 Local Tourism Audio Guide</h1><p>Discover India's heritage through stories, languages and local navigation.</p></header>
<div class="wrap">
<div id="home" class="home"><div class="hero"><h2>Discover India's Heritage</h2><p>Explore historic places and listen to visitor-friendly audio guides.</p><input id="search" class="search" placeholder="Search site, city or state..." oninput="render()"></div><div class="chips"><button onclick="filterState('All')">All</button><button onclick="filterState('Telangana')">Telangana</button><button onclick="filterState('Uttar Pradesh')">Uttar Pradesh</button><button onclick="filterState('Karnataka')">Karnataka</button><button onclick="filterState('Delhi')">Delhi</button><button onclick="filterState('Maharashtra')">Maharashtra</button></div><div id="grid" class="grid"></div></div>
<div id="detail" class="detail"><button class="back" onclick="back()">← Back to Explore</button><div id="detailBody"></div></div></div>
<script>
const sites=[
{id:1,name:'Charminar',city:'Hyderabad',state:'Telangana',emoji:'🕌',desc:'Historic monument and mosque at the heart of Hyderabad.',history:'Built in 1591, Charminar is an iconic landmark of Hyderabad and a major symbol of the city.',lat:17.3616,lon:78.4747,audio:{en:'audio/charminar_en.wav',te:'audio/charminar_te.wav',hi:'audio/charminar_hi.wav'}},
{id:2,name:'Golconda Fort',city:'Hyderabad',state:'Telangana',emoji:'🏰',desc:'Massive fort complex known for architecture, acoustics and history.',history:'Golconda developed as a major fortified center and became associated with the Qutb Shahi rulers.',lat:17.3833,lon:78.4011,audio:{en:'audio/golconda_en.wav',te:'audio/golconda_te.wav',hi:'audio/golconda_hi.wav'}},
{id:3,name:'Taj Mahal',city:'Agra',state:'Uttar Pradesh',emoji:'🏛️',desc:'World-famous marble monument on the banks of the Yamuna.',history:'Commissioned by Shah Jahan in the seventeenth century, the Taj Mahal is renowned for its Mughal architecture.',lat:27.1751,lon:78.0421,audio:{en:'audio/taj_en.wav',te:'audio/taj_te.wav',hi:'audio/taj_hi.wav'}},
{id:4,name:'Red Fort',city:'Delhi',state:'Delhi',emoji:'🧱',desc:'Historic Mughal-era fort and major landmark of Old Delhi.',history:'The Red Fort was commissioned by Shah Jahan and became an important center of Mughal power.',lat:28.6562,lon:77.2410,audio:{en:'audio/redfort_en.wav',te:'audio/redfort_te.wav',hi:'audio/redfort_hi.wav'}},
{id:5,name:'Hampi',city:'Vijayanagara',state:'Karnataka',emoji:'🛕',desc:'Vast archaeological landscape filled with temples and ruins.',history:'Hampi was the capital of the Vijayanagara Empire and is known for its monumental ruins.',lat:15.3350,lon:76.4600,audio:{en:'audio/hampi_en.wav',te:'audio/hampi_te.wav',hi:'audio/hampi_hi.wav'}},
{id:6,name:'Gateway of India',city:'Mumbai',state:'Maharashtra',emoji:'🌊',desc:'Monument overlooking the Arabian Sea at Apollo Bunder.',history:'The Gateway of India was built in the early twentieth century and became a prominent Mumbai landmark.',lat:18.9220,lon:72.8347,audio:{en:'audio/gateway_en.wav',te:'audio/gateway_te.wav',hi:'audio/gateway_hi.wav'}}];
let state='All', currentAudio=null;
function filterState(s){state=s;render()}
function render(){const q=document.getElementById('search').value.toLowerCase();const f=sites.filter(x=>(state==='All'||x.state===state)&&(`${x.name} ${x.city} ${x.state}`).toLowerCase().includes(q));document.getElementById('grid').innerHTML=f.length?f.map(x=>`<div class="card"><div class="pic">${x.emoji}</div><div class="content"><button class="fav" onclick="fav(event,${x.id})">${isFav(x.id)?'♥':'♡'}</button><h3>${x.name}</h3><div class="muted">${x.city}, ${x.state}</div><p>${x.desc}</p><button class="btn" onclick="openSite(${x.id})">Explore</button></div></div>`).join(''):`<div class="empty">No tourist sites found.</div>`}
function isFav(id){return JSON.parse(localStorage.getItem('favs')||'[]').includes(id)}
function fav(e,id){e.stopPropagation();let a=JSON.parse(localStorage.getItem('favs')||'[]');a=a.includes(id)?a.filter(x=>x!==id):[...a,id];localStorage.setItem('favs',JSON.stringify(a));render();if(window.Android)Android.toast(a.includes(id)?'Added to favorites':'Removed from favorites')}
function openSite(id){const x=sites.find(s=>s.id===id);document.getElementById('home').classList.add('hide');document.getElementById('detail').classList.add('show');document.getElementById('detailBody').innerHTML=`<div class="hero"><div class="pic">${x.emoji}</div><h2>${x.name}</h2><div class="muted">${x.city}, ${x.state}, India</div><p>${x.desc}</p></div><section><h3>History</h3><p>${x.history}</p></section><section><h3>Audio Guide</h3><select class="select" id="lang" onchange="loadAudio(${x.id})"><option value="en">English</option><option value="te">Telugu</option><option value="hi">Hindi</option></select><div class="audio"><audio id="player" controls class="progress"></audio><p id="audioStatus">Select a language and press play.</p></div></section><section><h3>Location</h3><p>Latitude: ${x.lat}<br>Longitude: ${x.lon}</p><button class="btn" onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${x.lat},${x.lon}','_blank')">Get Directions</button></section>`;loadAudio(id)}
function loadAudio(id){const x=sites.find(s=>s.id===id);const l=document.getElementById('lang').value;const p=document.getElementById('player');p.pause();p.currentTime=0;p.src=x.audio[l];document.getElementById('audioStatus').textContent='Audio guide ready. If no audio is bundled, replace the WAV files in app/src/main/assets/audio/.';p.load()}
function back(){if(currentAudio)currentAudio.pause();document.getElementById('detail').classList.remove('show');document.getElementById('home').classList.remove('hide');render()}
render();
</script></body></html>
